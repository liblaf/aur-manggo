name: Validate and update Manggo

on:
  schedule:
    # 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      validate_current:
        description: Validate and synchronize the current package even without a new release
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: manggo-${{ github.event_name == 'pull_request' && github.ref || 'update' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      latest: ${{ steps.upstream.outputs.latest }}
      aur_sync: ${{ steps.aur.outputs.needed }}
      maintenance_due: ${{ steps.health.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and publication safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Check official release metadata
        id: upstream
        run: python3 scripts/update.py --check --github-output "$GITHUB_OUTPUT"
      - name: Check whether AUR needs synchronization
        id: aur
        run: |
          git clone --quiet --depth 1 https://aur.archlinux.org/manggo.git "$RUNNER_TEMP/aur-state"
          if cmp -s PKGBUILD "$RUNNER_TEMP/aur-state/PKGBUILD" && cmp -s .SRCINFO "$RUNNER_TEMP/aur-state/.SRCINFO"; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether monthly compatibility validation is due
        id: health
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          report = Path('automation-validation.json')
          due = True
          if report.exists():
              checked = datetime.fromisoformat(json.loads(report.read_text())['validated_at'])
              due = datetime.now(timezone.utc) - checked >= timedelta(days=28)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'needed={str(due).lower()}\n')
          PY

  validate:
    needs: check
    if: >-
      needs.check.outputs.changed == 'true' ||
      needs.check.outputs.aur_sync == 'true' ||
      needs.check.outputs.maintenance_due == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.validate_current)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, install, and launch in a disposable Arch environment
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/candidate:/candidate" \
            --env "BASE_COMMIT=$GITHUB_SHA" \
            archlinux:base bash /workspace/scripts/validate.sh
      - name: Upload only validated package metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-metadata
          path: |
            ${{ runner.temp }}/candidate/PKGBUILD
            ${{ runner.temp }}/candidate/.SRCINFO
            ${{ runner.temp }}/candidate/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [check, validate]
    environment: aur-publish
    if: >-
      github.repository == 'liblaf/aur-manggo' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-metadata
          path: ${{ runner.temp }}/candidate
      - name: Prepare AUR authentication
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur-key"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/aur-key" > /dev/null
      - name: Publish validated metadata to AUR and prepare GitHub changes
        env:
          GIT_LFS_SKIP_PUSH: '1'
          GIT_SSH_COMMAND: >-
            ssh -i "${{ runner.temp }}/aur-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${{ github.workspace }}/config/aur-known-hosts"
            -o ConnectTimeout=15
        run: |
          git clone --quiet --branch master ssh://aur@aur.archlinux.org/manggo.git "$RUNNER_TEMP/aur"
          python3 scripts/publish.py --candidate "$RUNNER_TEMP/candidate" --aur-checkout "$RUNNER_TEMP/aur" --branch main --record-validation
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/aur-key"
      - name: Prepare GitHub publication branch
        id: publication-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/aur-automation/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -f "sha=$GITHUB_SHA" > /dev/null
      - name: Commit validated metadata to GitHub
        id: commit
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          branch: aur-automation/${{ github.run_id }}-${{ github.run_attempt }}
          commit_message: 'chore: record Manggo validation [skip ci]'
          files: |
            PKGBUILD
            .SRCINFO
            automation-validation.json
      - name: Publish the verified commit to main
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$COMMIT_SHA" --jq '.verification.verified')" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f "sha=$COMMIT_SHA" -F force=false > /dev/null
      - name: Remove GitHub publication branch
        if: always() && steps.publication-branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/aur-automation/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
